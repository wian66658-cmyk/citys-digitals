name: Supabase Migrate

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Error: SUPABASE_ACCESS_TOKEN secret is empty."
            exit 1
          fi
          echo "Token exists: Yes"
          echo "Length: ${#SUPABASE_ACCESS_TOKEN}"
          if [[ "$SUPABASE_ACCESS_TOKEN" == sbp_* ]]; then
            echo "Starts with sbp_: Yes"
          else
            echo "Starts with sbp_: No"
            echo "Error: The GitHub secret value is not a valid Supabase Personal Access Token."
            exit 1
          fi

      - name: Authenticate Supabase CLI
        run: |
          TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')"
          supabase login --token "$TOKEN"

      - name: Link Supabase project
        run: supabase link --project-ref diadjzyompobeepotxgl --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push --linked
